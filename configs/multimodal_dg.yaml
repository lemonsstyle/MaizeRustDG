seed: 42
data:
  manifest: data/manifest.csv
  grade_order: [CK, 1, 3, 5, 7, 9]
  validation_fraction: 0.2
  weather_window_hours: 72
  group_fields: [site, date, plot_id, plant_id]
model:
  image_backbone: dinov2_vits14
  pretrained: true
  freeze_image_backbone: true
  image_feature_dim: 384
  weather_input_dim: 2
  weather_hidden_dim: 128
  fusion_dim: 256
  num_classes: 6
  ordinal: true
training:
  epochs: 80
  batch_size: 12
  learning_rate: 0.0001
  weight_decay: 0.0001
  domain_alignment: deep_coral
  domain_weight: 0.1
  early_stopping_patience: 12
evaluation:
  primary_metrics: [macro_f1, qwk, mae]
  seeds: [42, 3407, 2024]
