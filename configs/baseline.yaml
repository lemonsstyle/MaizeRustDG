seed: 42
data:
  manifest: data/manifest.csv
  grade_order: [CK, 1, 3, 5, 7, 9]
  validation_fraction: 0.2
model:
  image_backbone: convnext_tiny
  pretrained: true
  feature_dim: 256
  num_classes: 6
  ordinal: false
training:
  epochs: 50
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.0001
  domain_weight: 0.0
  early_stopping_patience: 10
